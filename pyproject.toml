[project]
name = "trendradar"
version = "6.10.0"
description = "TrendRadar - 热点新闻聚合与分析工具"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "pytz==2026.5",
    "PyYAML==6.0.3",
    "fastmcp==4.1.0",
    "websockets==17.2",
    "feedparser==6.0.14",
    "boto3==1.43.110",
    "litellm==1.104.2",
    "json-repair==0.63.5",
    "tenacity==9.2.1",
]

[project.scripts]
trendradar = "trendradar.__main__:main"
trendradar-mcp = "mcp_server.server:run_server"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendradar", "mcp_server"]
